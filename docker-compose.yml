name: protarget-foundation
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm setup:env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:env}
      POSTGRES_DB: ${POSTGRES_DB:-protarget}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run pnpm setup:env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5544}:5432"]
    volumes:
      - foundation-pg:/var/lib/postgresql/data
      - ./infra/db-init.sh:/docker-entrypoint-initdb.d/10-foundation.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6390}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1125}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8125}:8025"
  migrate:
    build: { context: ., dockerfile: infra/Dockerfile.api }
    image: protarget-foundation-api:local
    command: ["sh", "infra/migrate.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-protarget}
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: { context: ., dockerfile: infra/Dockerfile.api }
    image: protarget-foundation-api:local
    environment: &api-environment
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: "4100"
      DATABASE_URL: postgresql://protarget_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-protarget}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Run pnpm setup:env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3100}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: ${SMTP_FROM:-invitations@protarget.local}
    ports: ["127.0.0.1:${API_PORT:-4100}:4100"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
  web:
    build: { context: ., dockerfile: infra/Dockerfile.web }
    environment:
      NODE_ENV: production
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3100"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3100}
      API_INTERNAL_URL: http://api:4100
    ports: ["127.0.0.1:${WEB_PORT:-3100}:3100"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
  seed:
    image: protarget-foundation-api:local
    command: ["node", "apps/api/prisma/seed.cjs"]
    profiles: ["seed"]
    environment:
      <<: *api-environment
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_TENANT_PASSWORD: ${SEED_TENANT_PASSWORD}
    depends_on:
      migrate: { condition: service_completed_successfully }
  minio:
    # Supply a locally built/approved pinned image before enabling this optional profile.
    image: ${MINIO_IMAGE:-protarget-minio:local}
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-protarget}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9100}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes: [foundation-minio:/data]
  clamav:
    image: clamav/clamav:1.4
    profiles: ["antivirus"]
volumes:
  foundation-pg:
  foundation-minio:
